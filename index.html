<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: dùng cả vùng tai thỏ trên iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sâu Chart</title>

  <!-- Để "Thêm vào Màn hình chính" trên iPhone/iPad trông như app thật -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sâu Chart" />
  <meta name="theme-color" content="#1d1f28" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="style.css?v=202611061020" />
  <!-- Thư viện vẽ biểu đồ mã nguồn mở của chính TradingView -->
  <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <!-- Thanh công cụ phía trên -->
  <header class="toolbar">
    <div class="brand">🐛 Sâu Chart</div>
    <div class="symbol-title">
      <span id="symbolTitle">BTCUSDT</span>
      <span id="symbolPrice" class="symbol-price"></span>
    </div>
    <div class="timeframes" id="timeframes"></div>
    <button class="icon-btn" id="btnCaiDat">⚙︎ Chỉ báo</button>
    <button class="icon-btn" id="btnEA">⚡ EA</button>
    <button class="icon-btn" id="btnCoBo">▦ Co bó</button>
    <div class="status" id="status"><span class="dot">●</span><span class="status-text">Đang kết nối...</span></div>
  </header>

  <main class="layout">
    <!-- Khu vực biểu đồ -->
    <section class="chart-wrap">
      <div class="legend" id="legend"></div>
      <div class="legend legend-rsi" id="legendRsi"></div>
      <div id="chart"></div>
      <button id="btnPhongTo" class="btn-phong-to" title="Phóng to khung giá">⤢</button>
      <button id="btnRsiNhom" class="btn-rsi-nhom" title="Nhóm đường RSI" style="display:none">☰</button>
      <div id="popupRsiNhom" class="popup-rsi-nhom" style="display:none">
        <label><input type="checkbox" class="rni-ma"> EMA9 + WMA45</label>
        <label><input type="checkbox" class="rni-bb"> BB20 + BB55</label>
      </div>
      <div id="nhanGia" style="display:none;position:absolute;right:0;z-index:10;pointer-events:none">
        <div class="ng-gia"></div>
        <div class="ng-dem"></div>
      </div>
      <!-- EA overlays -->
      <div id="eaStatus" class="ea-status" style="display:none"></div>
      <div id="eaTrades" class="ea-trades" style="display:none">
        <div class="eat-head">
          <span>Lệnh EA L5</span>
          <button id="btnDongTrades">✕</button>
        </div>
        <div id="eaTradesList"></div>
      </div>
    </section>

    <!-- Watchlist: bên phải trên máy tính, thành dải ngang trên điện thoại -->
    <aside class="watchlist" id="watchlistPanel">
      <div class="watchlist-header">
        <button id="btnToggleWL" class="wl-toggle-btn">Mã <span class="wl-arrow">›</span></button>
        <span class="wl-hdr-gia">Giá</span>
        <span class="wl-hdr-24h">24h</span>
      </div>
      <div id="watchlist"></div>
    </aside>
  </main>

  <!-- Bảng EA -->
  <div class="panel" id="panelEA" hidden>
    <div class="panel-box">
      <div class="panel-head">
        <span>⚡ EA</span>
        <button class="icon-btn" id="btnDongEA">✕</button>
      </div>
      <div id="eaPanelBody">
        <div class="panel-nhom">EA</div>
        <label class="panel-dong" id="eaL5Row">
          <input type="checkbox" id="eaL5On">
          <i style="background:#f5c518;width:14px;height:14px;border-radius:3px"></i>
          <span>L5</span>
        </label>
        <div id="eaLoaiRow" style="display:none;padding:2px 14px 4px;gap:6px;flex-wrap:wrap"></div>
        <div id="eaF1Luong" style="display:none">
          <div class="panel-nhom">Luồng F2</div>
          <label class="panel-dong"><input type="checkbox" class="ea-f1-luong" data-leg="H2">
            <i style="background:#f0a030;width:14px;height:14px;border-radius:3px"></i><span>H2</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-f1-luong" data-leg="H4">
            <i style="background:#4fc3f7;width:14px;height:14px;border-radius:3px"></i><span>H4</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-f1-luong" data-leg="D">
            <i style="background:#d65db1;width:14px;height:14px;border-radius:3px"></i><span>D</span></label>
        </div>
        <div id="eaL5Luong">
          <div class="panel-nhom">Luồng L5</div>
          <label class="panel-dong"><input type="checkbox" class="ea-luong" data-leg="D">
            <i style="background:#f5c518"></i><span>D</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-luong" data-leg="H4">
            <i style="background:#00bcd4"></i><span>H4</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-luong" data-leg="H8">
            <i style="background:#ab47bc"></i><span>H8</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-luong" data-leg="H12">
            <i style="background:#ff7043"></i><span>H12</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-luong" data-leg="Trap">
            <i style="background:#66bb6a"></i><span>Trap</span></label>
        </div>
        <div id="eaS1Luong" style="display:none">
          <div class="panel-nhom">Luồng S1</div>
          <label class="panel-dong"><input type="checkbox" class="ea-s1-luong" data-leg="W">
            <i style="background:#f5c518;width:14px;height:14px;border-radius:3px"></i><span>W</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-s1-luong" data-leg="D">
            <i style="background:#00bcd4;width:14px;height:14px;border-radius:3px"></i><span>D</span></label>
          <label class="panel-dong"><input type="checkbox" class="ea-s1-luong" data-leg="2D">
            <i style="background:#ab47bc;width:14px;height:14px;border-radius:3px"></i><span>2D</span></label>
        </div>
        <div class="panel-nhom">Hiển thị</div>
        <label class="panel-dong"><input type="checkbox" id="eaShowEntry"><span>Lệnh có trạng thái</span></label>
        <label class="panel-dong"><input type="checkbox" id="eaShowSLTP"><span>Mức SL/TP</span></label>
        <label class="panel-dong"><input type="checkbox" id="eaShowPnl"><span>Lãi/Lỗ</span></label>
        <label class="panel-dong"><input type="checkbox" id="eaShowHist"><span>Lịch sử giao dịch</span></label>
        <label class="panel-dong"><input type="checkbox" id="eaShowBTS"><span>Bảng trạng thái</span></label>
        <label class="panel-dong"><input type="checkbox" id="eaShowDS"><span>Danh sách lệnh</span></label>
        <div id="eaVNNote" class="ea-vn-note" style="display:none">Chưa có EA cho chứng khoán</div>
      </div>
    </div>
  </div>

  <!-- Bảng Vùng Co bó -->
  <div class="panel" id="panelCoBo" hidden>
    <div class="panel-box panel-box--cobo">
      <div class="panel-head">
        <span>▦ Vùng co bó</span>
        <button class="icon-btn" id="btnDongCoBo">✕</button>
      </div>
      <div id="coboPanelBody">
        <div class="panel-nhom">Loại co bó</div>
        <div id="coboLoaiRow" class="cobo-row"></div>
        <div class="panel-nhom" id="coboBBNhom">Ngưỡng BB</div>
        <div id="coboBBNguongRow" class="cobo-row"></div>
        <div class="panel-nhom" id="coboSMANhom">Ngưỡng SMA</div>
        <div id="coboNguongRow" class="cobo-row"></div>
        <div class="panel-nhom" id="coboKhungNhom">Hiển thị khung</div>
        <div id="coboVisRow" class="cobo-row"></div>
        <div class="panel-nhom" id="coboTabNhom">Phân tích chồng khung</div>
        <div id="coboTabRow" class="cobo-row"></div>
        <div class="panel-nhom" id="coboCombNhom">Hiển thị SMA+BB</div>
        <div id="coboCombVisRow" class="cobo-row"></div>
        <div style="padding:0 14px 4px" id="coboBang"></div>
      </div>
    </div>
  </div>

  <!-- Bảng bật/tắt chỉ báo -->
  <div class="panel" id="panelCaiDat" hidden>
    <div class="panel-box">
      <div class="panel-head">
        <span>Chỉ báo</span>
        <button class="icon-btn" id="btnDong">✕</button>
      </div>
      <div id="dsChiBao"></div>
    </div>
  </div>

  <script src="ea-l5-engine.js?v=202611061020"></script>
  <script src="ea-l5-data.js?v=202611061020"></script>
  <script src="ea-f2-engine.js?v=202611061020"></script>
  <script src="ea-f2-data.js?v=202611061020"></script>
  <script src="ea-s1-engine.js?v=202611061020"></script>
  <script src="ea-s1-data.js?v=202611061020"></script>
  <script src="indicators.js?v=202611061020"></script>
  <script src="app.js?v=202611061020"></script>
</body>
</html>
